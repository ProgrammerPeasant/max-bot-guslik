# Афиша фестиваля. Скопируй в lineup.toml и заполни реальными данными.
# Один [[act]] = один день = один партнер на сцене.

[festival]
title = "Бот розыгрышей"
timezone = "Europe/Moscow"
max_chances = 10
# картинка приветственного баннера (прямая ссылка), можно оставить пустой
banner = ""
rules_url = "https://example.com/rules"

[final]
prize = "два билета на концерт Канье Уэста"
winners = 5
reserves = 5
# сколько часов у победителя финала на подтверждение приза
claim_hours = 48
data_recipient = "партнеру и билетному оператору"

[[act]]
day = 2026-09-01
partner = "Кофейня Зерно"
# id канала партнера в MAX; бот должен быть в нем администратором
channel_id = -70000000000001
channel_url = "https://max.ru/zerno_coffee"
promo_where = "любой точке сети Зерно"
promo_until = 2026-09-30
instructions = "покажи это сообщение на кассе любой кофейни Зерно до 15 сентября"
prizes = [
    { name = "годовой абонемент на капучино", count = 1 },
    { name = "сертификат на 2000 рублей", count = 3 },
]

[[act]]
day = 2026-09-02
partner = "Самокаты Вжух"
channel_id = -70000000000002
channel_url = "https://max.ru/vzhuh"
promo_where = "в приложении Вжух"
promo_until = 2026-10-01
instructions = "дождись письма от партнера: он свяжется в течение трех рабочих дней"
prizes = [{ name = "месяц безлимитных поездок", count = 5 }]
