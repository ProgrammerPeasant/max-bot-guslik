[project]
name = "festpass"
version = "0.1.0"
description = "Бот розыгрышей для мессенджера MAX: промокоды партнеров, призы дня и фестивальный пропуск"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
festbot = "festpass.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["festpass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
